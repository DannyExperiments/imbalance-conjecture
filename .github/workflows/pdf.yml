name: PDF build

on:
  push:
    branches: [main]
    paths:
      - "paper/manuscript.tex"
      - "paper/references.bib"
      - "paper/latexmkrc"
      - ".github/workflows/pdf.yml"
  pull_request:
    branches: [main]
    paths:
      - "paper/manuscript.tex"
      - "paper/references.bib"
      - "paper/latexmkrc"
      - ".github/workflows/pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile the paper from TeX and bibliography
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b
        with:
          root_file: manuscript.tex
          working_directory: paper
          texlive_version: 2026
      - name: Upload compiled paper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manuscript-pdf
          path: paper/manuscript.pdf
          if-no-files-found: error
